services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quantumroute
      POSTGRES_USER: quantumroute
      POSTGRES_PASSWORD: quantumroute-local-only
    ports:
      - "5432:5432"
    volumes:
      - quantumroute_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumroute -d quantumroute"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quantumroute_pgdata:
